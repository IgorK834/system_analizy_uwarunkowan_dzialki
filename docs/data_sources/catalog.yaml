      mają status HTTP 200: błąd wejścia to wiersz "error<TAB>...", a brak danych
      wysokościowych to sentinel Hmin=2500 / Hmax=0. Sekcja jest informacyjna
      (rzeźba terenu, deniwelacja), nie prawna, więc jej niedostępność nie
      obniża statusu analizy. Adapter: app/services/nmt.py.

