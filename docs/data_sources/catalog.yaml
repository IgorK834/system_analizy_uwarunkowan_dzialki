# Katalog źródeł danych — jedyne źródło prawdy dla kontraktów urzędowych
# i licencjonowanych danych wykorzystywanych przez system.
#
# ZASADY (patrz ANALIZA_ARCHITEKTURY_I_PLAN.md sekcja D oraz context.md pkt 10):
#   * Adresy, warstwy, licencje, CRS, SLA i częstotliwości aktualizacji NIE są
#     wymyślane. Jeżeli kontraktu lub licencji nie udało się potwierdzić w
#     oficjalnej dokumentacji właściciela danych, źródło ma status `research`
#     (lub `contract_required` / `no_redistribution` / `placeholder`) oraz
#     `production_ready: false`.
#   * Źródło może zostać uruchomione przez produkcyjny orchestrator wyłącznie,
#     gdy `status: production`, `production_ready: true` oraz
#     `contract_confirmed: true` (funkcja `ensure_source_runnable`).
#   * Geometria kanoniczna całego systemu jest w EPSG:2180, dlatego `target_crs`
#     każdego wpisu musi być równy `EPSG:2180`.
#
# Weryfikacja ręczna źródeł produkcyjnych: 2026-07-22 (oficjalna dokumentacja
# Geoportal.gov.pl / GUGiK — usługi ULDK, UUG oraz WMS KIMPZP).

