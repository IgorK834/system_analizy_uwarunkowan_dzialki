      przyjmuje subset=x(easting) i subset=y(northing) i zwraca Float32 GeoTIFF
      dokładnie w granicach żądania — bbox niewyrównany do krawędzi natywnych
      pikseli jest przepróbkowywany przez serwer, dlatego adapter przyciąga okno
      do siatki. Obszar poza obwiednią: HTTP 400 ows:ExceptionReport
      exceptionCode=ExtentError (brak pokrycia). Nieznane pokrycie: HTTP 404
      NoSuchCoverage. Obszar w obwiedni bez danych (np. za granicą) wraca jako
      dokładne 0.0 BEZ znacznika GDAL_NODATA — adapter maskuje 0.0 jako NoData;
      wartości ujemne są realne (np. -0,25 m przy Zatoce Gdańskiej) i nie są
      odrzucane. Środowisko obrazu backendu: GDAL 3.10.3 (gdalinfo --version),
      bez rasterio. Adapter:
      app/modules/analysis/infrastructure/terrain_raster.py.

