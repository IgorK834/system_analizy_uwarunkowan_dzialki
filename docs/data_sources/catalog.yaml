      (minE,minN,maxE,maxN). Klasa prawdopodobieństwa jest w
      nz-core:qualitativeLikelihood ("scenariusz Q 1% (raz na 100 lat)");
      pole liczbowe probabilityOfOccurrence jest w danych źródłowych niespójne
      (0.002 i 0.02 dla tego samego scenariusza 0,2%), więc NIE jest używane —
      zapasem jest returnPeriod. Warstwy nz-core:RiskZone (ok. 1,7 mln cech,
      ryzyko dla elementów narażonych) i nz-core:ExposedElement istnieją w
      usłudze, ale nie są używane w tej sekcji. Adapter: app/services/isok.py.

