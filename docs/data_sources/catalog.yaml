      CRS to EPSG:2180, ale srsName jest w formie URN, czyli kolejność osi w
      zwracanej geometrii to (northing, easting) — odwrotnie niż w geometrii
      kanonicznej z ULDK; parametr bbox przyjmuje kolejność (minE,minN,maxE,maxN).
      Warstwy punktowe (GDOS:PomnikiPrzyrodyPunktowe) oraz warstwy, które nie są
      formami ochrony przyrody (korytarzeEkologiczne, Mezoregiony, ramsar,
      ElektrownieWiatrowe) i warstwy proponowanych zmian Natura 2000 są świadomie
