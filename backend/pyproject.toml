[project]
name = "dzialki-backend"
version = "0.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: testy wymagające uruchomionego Dockera",
    "docker_cli: testy wymagające docker CLI na hoście (subprocess)",
]

[tool.coverage.run]
source = ["app"]

[tool.mypy]
python_version = "3.13"
# shapely, pyproj i inne biblioteki GIS nie publikują stubów typów.
ignore_missing_imports = true
