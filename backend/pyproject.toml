[project]
name = "dzialki-backend"
version = "0.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: testy wymagające uruchomionego Dockera",
    "docker_cli: testy wymagające docker CLI na hoście (subprocess)",
]

[tool.coverage.run]
source = ["app"]
