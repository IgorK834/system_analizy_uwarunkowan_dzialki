# AU-010: automatyczne propozycje aktualizacji zależności i obrazów bazowych. Zmiany w `backend/`
# wymagają przeliczenia locka (`pip-compile --generate-hashes`, polecenie w nagłówku
# `backend/requirements.lock`) — Dependabot aktualizuje dolne granice w `requirements.in`, a lock
# odnawia się w osobnym commicie. `npm audit` i `pip-audit` w CI wykrywają podatne wersje niezależnie.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
