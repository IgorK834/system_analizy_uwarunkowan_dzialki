name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend — build i testy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Przygotuj zmienne środowiskowe
        run: cp .env.example .env

      - name: Zweryfikuj konfigurację Compose
        run: docker compose config

      - name: Zbuduj obraz backendu
        run: docker compose build backend

      - name: Zbuduj obraz frontendu
        run: docker compose build frontend

      - name: Testy frontendu i coverage wewnątrz kontenera
        run: |
          docker build --build-context shared=./shared --target test -t dzialki-frontend-test ./frontend
          docker run --rm \
            -e NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 \
            dzialki-frontend-test \
            npm run test:coverage

      - name: Testy backendu wewnątrz kontenera
        run: |
          rm -f .env
          docker compose run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -e REPO_ROOT=/repo \
            backend \
            pytest -m 'not docker_cli' --cov=app --cov-report=term-missing --cov-fail-under=80 -v

      - name: Zatrzymaj kontenery i usuń volumeny
        if: always()
        run: docker compose down -v
